name: Test

on:
  push:
    branches-ignore: ["main"]

env:
  NODE_VERSION: "24.15.0"

jobs:
  test:
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !startsWith(github.ref, 'refs/heads/release-please--') }}
    runs-on: blacksmith-4vcpu-ubuntu-2204

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391
        with:
          node-version: "${{ env.NODE_VERSION }}"
      - name: Pin package tools
        run: |
          npm install --global npm@11.6.2 yarn@1.22.22 --force
          test "$(npm --version)" = 11.6.2
          test "$(yarn --version)" = 1.22.22
      - name: Publication guard regression
        run: node --test .github/scripts/publish.test.cjs
      - name: Yarn install
        run: |
          yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Validate build
        run: yarn build

      - name: Public package types
        run: yarn test:types
      - name: Public package boundary tests
        run: yarn test --runInBand
      - name: Check formatting
        run: yarn biome format .
