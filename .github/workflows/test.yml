name: Test

on:
  push:
    branches-ignore: ["main"]

env:
  NODE_VERSION: ">=18.12.1"

jobs:
  test:
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !startsWith(github.ref, 'refs/heads/release-please--') }}
    runs-on: blacksmith-4vcpu-ubuntu-2204

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.FLOWCORE_MACHINE_GITHUB_TOKEN }}
          submodules: true
      - name: Setup Node.js environment
        uses: actions/setup-node@v3.5.1
        with:
          node-version: "${{ env.NODE_VERSION }}"
      - name: Yarn install
        run: |
          yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Validate build
        run: yarn build

      - name: Public package types
        run: yarn test:types
      - name: Public package boundary tests
        run: yarn test --runInBand
      - name: Check formatting
        run: yarn biome format .
